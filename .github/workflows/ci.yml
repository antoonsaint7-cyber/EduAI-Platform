name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: node --check server.js && node --check public/app.js && node --check public/education.js && node --check src/educational-engine/pipeline.js && node --check src/educational-engine/schema.js

      - name: Offline educational engine evals
        run: node evals/educational-engine.test.mjs

      - name: Run project tests
        run: npm test --if-present

      - name: Security audit
        run: npm audit --audit-level=high
