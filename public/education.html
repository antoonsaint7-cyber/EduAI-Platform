<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduAI | AI Tutor 🎓</title><link rel="stylesheet" href="/education.css"></head><body><main class="edu"><header><div class="topbar"><span>EDUAI 🎓🤖</span><label class="language-picker"><span aria-hidden="true">🌐</span><span class="sr-only">Language</span><select id="language" aria-label="Language"><option value="ar">العربية</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option></select></label></div><h1 data-i18n="title">مدرسك الذكي</h1><p data-i18n="subtitle">مساعد تعليمي ذكي للطالب والمدرس.</p></header><section class="controls"><label><span data-i18n="mode">الوضع</span><select id="mode"><option value="student" data-i18n="student">👨‍🎓 طالب</option><option value="teacher" data-i18n="teacher">👨‍🏫 مدرس</option></select></label><label><span data-i18n="subject">المادة</span><select id="subject"><option>الدراسات الاجتماعية</option><option>التاريخ</option><option>الجغرافيا</option><option>اللغة العربية</option><option>العلوم</option><option>الرياضيات</option><option>English</option></select></label><label><span data-i18n="level">المستوى</span><select id="level"><option data-i18n="beginner">مبتدئ</option><option data-i18n="intermediate">متوسط</option><option data-i18n="advanced">متقدم</option></select></label></section><div class="actions"><button data-action="explain" data-i18n="explain">📚 اشرح الدرس</button><button data-action="quiz" data-i18n="quiz">📝 اعمل اختبار</button><button data-action="review" data-i18n="review">🔄 راجع أخطائي</button><button data-action="plan" data-i18n="plan">📅 خطة مذاكرة</button></div><section class="chat"><div id="messages"></div><textarea id="input" maxlength="2000" data-i18n-placeholder="placeholder" placeholder="اكتب الدرس أو السؤال هنا..."></textarea><div><button id="send" data-i18n="send">إرسال</button><button id="mic" data-i18n="talk">🎙️ تحدث</button><button id="clear" data-i18n="clear">مسح</button></div></section></main><script src="/i18n.js"></script><script src="/education.js"></script><script>document.getElementById('language').value=window.EduAI18n.current();document.getElementById('language').addEventListener('change',e=>window.EduAI18n.set(e.target.value));window.EduAI18n.init();</script></body></html>
