<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduAI | Student Dashboard</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc;color:#172033}.wrap{max-width:1100px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #e3e7ef;border-radius:16px;padding:18px}.wide{grid-column:span 2}.muted{color:#687386}.bar{height:8px;background:#e8ebf1;border-radius:8px}.bar span{display:block;height:100%;background:#4b6bfb;border-radius:8px}.item{padding:12px 0;border-bottom:1px solid #edf0f5}.btn{display:inline-block;background:#172033;color:#fff;padding:10px 14px;border-radius:10px;text-decoration:none;border:0;cursor:pointer}@media(max-width:800px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="wrap"><p class="muted">EduAI Platform · Student</p><h1>Learning Dashboard</h1><div class="grid"><section class="card"><span class="muted">Weak topics</span><h2 id="weak">—</h2><p class="muted">Topics needing attention</p></section><section class="card"><span class="muted">Assessments</span><h2 id="attempts">—</h2><p class="muted">Recent attempts</p></section><section class="card"><span class="muted">Recommendations</span><h2 id="recs">—</h2><p class="muted">Next learning steps</p></section><section class="card wide"><h2>Recommended Lessons</h2><div id="recommendations" class="muted">Loading…</div></section><section class="card"><h2>Mastery</h2><div id="mastery" class="muted">Loading…</div></section><section class="card"><h2>Assessment History</h2><div id="history" class="muted">Loading…</div></section></div></main><script>async function load(){const [n,h,m]=await Promise.all([fetch('/api/learning/next'),fetch('/api/assessments/history'),fetch('/api/learning/mastery')]);if([n,h,m].some(x=>x.status===401)){location.href='/index.html';return}const next=await n.json(),hist=await h.json(),mastery=await m.json();document.getElementById('weak').textContent=next.weak_topics?.length??0;document.getElementById('attempts').textContent=hist.attempts?.length??0;document.getElementById('recs').textContent=next.recommendations?.length??0;document.getElementById('recommendations').innerHTML=(next.recommendations||[]).map(x=>`<div class="item"><b>${x.lesson.title}</b><div class="muted">${x.reason} · ${x.priority_level}</div><div class="bar"><span style="width:${Math.max(5,Math.min(100,100-(x.mastery??0)))}%"></span></div></div>`).join('')||'No recommendations yet.';document.getElementById('mastery').innerHTML=(mastery.topics||[]).slice(0,8).map(x=>`<div class="item"><b>${x.topic}</b><div class="muted">${x.subject} · ${Number(x.mastery).toFixed(0)}%</div><div class="bar"><span style="width:${Math.max(0,Math.min(100,Number(x.mastery)))}%"></span></div></div>`).join('')||'No mastery data yet.';document.getElementById('history').innerHTML=(hist.attempts||[]).slice(0,6).map(x=>`<div class="item"><b>${x.lesson_title}</b><div class="muted">${x.score}% · ${new Date(x.submitted_at).toLocaleDateString()}</div></div>`).join('')||'No attempts yet.'}load().catch(e=>document.body.insertAdjacentHTML('beforeend',`<p>Unable to load dashboard.</p>`));</script></body></html>
