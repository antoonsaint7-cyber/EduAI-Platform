name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # GitHub-hosted Ubuntu runners include a supported Node.js runtime.
      # Avoid setup-node here because the repository's CI environment was
      # failing before any project command could execute.
      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Syntax and unit tests
        run: npm test

      - name: API smoke test
        run: npm run test:e2e

      - name: Offline educational evals
        run: node evals/run-evals.mjs

      - name: Security audit
        run: npm audit --audit-level=high
