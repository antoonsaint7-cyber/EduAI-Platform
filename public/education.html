<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Tutor 🎓</title><link rel="stylesheet" href="/education.css"></head><body><main class="edu"><header><span>AI TUTOR 🎓</span><h1>مدرسك الذكي</h1><p>من المنهج الخام إلى درس تفاعلي، مع مراجعة قبل النشر.</p></header><section class="controls"><label>الوضع<select id="mode"><option value="student">👨‍🎓 طالب</option><option value="teacher">👨‍🏫 مدرس</option></select></label><label>المادة<select id="subject"><option>الدراسات الاجتماعية</option><option>التاريخ</option><option>الجغرافيا</option><option>اللغة العربية</option><option>العلوم</option><option>الرياضيات</option><option>English</option></select></label><label>المستوى<select id="level"><option>مبتدئ</option><option>متوسط</option><option>متقدم</option></select></label></section><section class="curriculum"><h2>📚 بناء منهج تلقائي</h2><p>ارفع PDF أو DOCX أو TXT، وسيحلله النظام ويجهز مسودة تعليمية قابلة للتقييم.</p><form id="curriculum-form"><input id="curriculum-title" name="title" placeholder="اسم المنهج أو الكتاب"><input id="curriculum-file" name="curriculum" type="file" accept=".pdf,.docx,.txt" required><button type="submit">رفع وتحليل المنهج</button></form><div id="curriculum-status" role="status"></div><div id="curriculum-actions" hidden><button id="generate-content">🧠 توليد المحتوى</button><button id="publish-content">✅ نشر بعد المراجعة</button></div></section><section class="actions"><button data-action="explain">📚 اشرح الدرس</button><button data-action="quiz">📝 اعمل اختبار</button><button data-action="review">🔄 راجع أخطائي</button><button data-action="plan">📅 خطة مذاكرة</button></section><section class="chat"><div id="messages"></div><textarea id="input" maxlength="2000" placeholder="اكتب الدرس أو السؤال هنا..."></textarea><div><button id="send">إرسال</button><button id="mic">🎙️ تحدث</button><button id="clear">مسح</button></div></section></main><script src="/education.js"></script></body></html>
