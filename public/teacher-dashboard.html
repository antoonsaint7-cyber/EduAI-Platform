<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduAI | Teacher Dashboard</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc;color:#172033}.wrap{max-width:1100px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #e3e7ef;border-radius:16px;padding:18px}.wide{grid-column:span 2}.muted{color:#687386}.item{padding:12px 0;border-bottom:1px solid #edf0f5}.bar{height:8px;background:#e8ebf1;border-radius:8px}.bar span{display:block;height:100%;background:#4b6bfb;border-radius:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="wrap"><p class="muted">EduAI Platform · Teacher</p><h1>Student Analytics</h1><div class="card"><p>Enter a student UUID to inspect tenant-scoped learning analytics.</p><input id="id" placeholder="Student UUID" style="padding:11px;width:min(500px,90%);border:1px solid #d9deea;border-radius:10px"><button onclick="load()" style="padding:11px 15px;border:0;border-radius:10px;background:#172033;color:white">Load</button></div><div id="out" class="grid" style="margin-top:16px"></div></main><script>async function load(){const id=document.getElementById('id').value.trim();if(!id)return;const r=await fetch('/api/analytics/teacher/student/'+encodeURIComponent(id));if(r.status===401){location.href='/index.html';return}const d=await r.json();if(!r.ok){document.getElementById('out').innerHTML='<div class="card">'+(d.error||'Unable to load')+'</div>';return}document.getElementById('out').innerHTML=`<section class="card"><span class="muted">Student</span><h2>${d.student.name}</h2><p>${d.student.email}</p></section><section class="card"><span class="muted">Average mastery</span><h2>${d.summary.average_mastery}%</h2><p>${d.summary.lessons_attempted} lessons attempted</p></section><section class="card"><span class="muted">Best score</span><h2>${d.summary.best_score}%</h2><p>${d.summary.attempts} assessment attempts</p></section><section class="card wide"><h2>Weak Topics</h2>${(d.weak_topics||[]).map(x=>`<div class="item"><b>${x.topic}</b><div class="muted">${x.subject} · ${Number(x.mastery).toFixed(0)}% · ${x.evidence_count} evidence</div><div class="bar"><span style="width:${Math.max(0,Math.min(100,Number(x.mastery)))}%"></span></div></div>`).join('')||'<p class="muted">No weak topics.</p>'}</section><section class="card"><h2>Recent Attempts</h2>${(d.attempts||[]).slice(0,8).map(x=>`<div class="item"><b>${x.lesson_title}</b><div class="muted">${x.score}% · ${new Date(x.submitted_at).toLocaleDateString()}</div></div>`).join('')||'<p class="muted">No attempts.</p>'}</section>`}</script></body></html>
