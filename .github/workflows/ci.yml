name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # GitHub-hosted Ubuntu runners include a supported Node.js runtime.
      # Avoid setup-node here because the repository's CI environment was
      # failing before any project command could execute.
      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Syntax and unit tests
        run: npm test

      - name: API smoke test
        run: npm run test:e2e

      - name: Offline educational evals
        run: node evals/run-evals.mjs

      - name: Security audit
        run: npm audit --audit-level=high
